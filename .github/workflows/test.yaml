name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 1,15 * *"
  # Re-runnable on demand: the vendored upstream is pinned, so a failure here is almost
  # always something in the environment rather than in this repo.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # to fail on error in multiline statements (-e), in pipes (-o pipefail), and on unset variables (-u).
    shell: bash -euo pipefail {0}

jobs:
  # One job, from uv.lock: the environment the reference bundle is generated in, so the
  # generator's guards test the torch and numpy that produce the numbers.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # without the vendored upstream every test skips, so CI would be green while testing nothing
          submodules: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install from the lockfile
        run: uv sync --frozen --extra test
      - name: Run tests
        env:
          MPLBACKEND: agg
        run: uv run pytest -v --color=yes
