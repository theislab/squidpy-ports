name: Generate reference bundle

# Produces stalign_reference.zarr.zip as a run artifact. A maintainer publishes it as a release
# asset by hand (see README), so this workflow never holds a token that can write.
#
# This runs on ubuntu on purpose. Upstream is bit-reproducible on CPU in float64 once
# thread counts are pinned, but BLAS/FFT reduction order still differs between macOS
# Accelerate and Linux OpenBLAS, and squidpy's CI compares on ubuntu.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    env:
      MKL_NUM_THREADS: "1"
      MPLBACKEND: agg
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Generate
        run: |
          uv sync --frozen
          uv run python -m squidpy_ports.stalign.generate --out stalign_reference.zarr.zip

      - name: Check the run is reproducible
        run: |
          uv run python -m squidpy_ports.stalign.generate --out again.zarr.zip
          uv run python - <<'PY'
          import sys
          import anndata as ad
          import numpy as np
          from zarr.storage import ZipStore

          def load(path):
              with ZipStore(path, mode="r") as store:
                  return ad.read_zarr(store).uns

          a, b = load("stalign_reference.zarr.zip"), load("again.zarr.zip")
          bad = [f"{name}/{key}" for name, section in a.items() if name != "fixtures"
                 for key, value in section.items() if key != "provenance"
                 and not np.array_equal(value, b[name][key])]
          if bad:
              sys.exit("not reproducible: " + ", ".join(bad))
          print("identical arrays across runs")
          PY
          sha256sum stalign_reference.zarr.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stalign-reference-bundle
          path: stalign_reference.zarr.zip
