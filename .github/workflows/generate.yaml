name: Generate reference bundle

# Produces <method>_reference.zarr.zip for every vendored upstream as run artifacts. A maintainer
# publishes them as release assets by hand (see README), so this workflow never holds a token that can write.
#
# This runs on ubuntu on purpose. Upstream is bit-reproducible on CPU in float64 once
# thread counts are pinned, but BLAS/FFT reduction order still differs between macOS
# Accelerate and Linux OpenBLAS, and squidpy's CI compares on ubuntu.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        method: [stalign, spage]
    name: generate (${{ matrix.method }})
    env:
      BUNDLE: ${{ matrix.method }}_reference.zarr.zip
      MKL_NUM_THREADS: "1"
      MPLBACKEND: agg
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Generate
        run: |
          uv sync --frozen --extra ${{ matrix.method }}
          uv run --no-sync python -m squidpy_ports.${{ matrix.method }}.generate --out "$BUNDLE"

      - name: Check the run is reproducible
        run: |
          uv run --no-sync python -m squidpy_ports.${{ matrix.method }}.generate --out again.zarr.zip
          uv run --no-sync python -m squidpy_ports._common "$BUNDLE" again.zarr.zip
          sha256sum "$BUNDLE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.method }}-reference-bundle
          path: ${{ matrix.method }}_reference.zarr.zip
