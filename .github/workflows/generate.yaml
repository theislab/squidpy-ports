name: Generate reference bundle

# Produces stalign_reference.zarr.zip as a run artifact. A maintainer publishes it as a release
# asset by hand (see README), so this workflow never holds a token that can write.
#
# This runs on ubuntu on purpose. Upstream is bit-reproducible on CPU in float64 once
# thread counts are pinned, but BLAS/FFT reduction order still differs between macOS
# Accelerate and Linux OpenBLAS, and squidpy's CI compares on ubuntu.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      MKL_NUM_THREADS: "1"
      MPLBACKEND: agg
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Generate
        run: |
          uv sync --frozen
          uv run python -m squidpy_ports.stalign.generate --out stalign_reference.zarr.zip

      - name: Check the run is reproducible
        run: |
          uv run python -m squidpy_ports.stalign.generate --out again.zarr.zip
          uv run python - <<'PY'
          import sys
          import numpy as np
          import zarr
          from zarr.storage import ZipStore

          a = zarr.open_group(ZipStore("stalign_reference.zarr.zip", mode="r"), mode="r")
          b = zarr.open_group(ZipStore("again.zarr.zip", mode="r"), mode="r")
          bad = [f"{name}/{key}" for name, group in a.groups() for key, array in group.arrays()
                 if not np.array_equal(array[...], b[name][key][...])]
          if bad:
              sys.exit("not reproducible: " + ", ".join(bad))
          print("bit-identical across runs")
          PY
          sha256sum stalign_reference.zarr.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stalign-reference-bundle
          path: stalign_reference.zarr.zip
