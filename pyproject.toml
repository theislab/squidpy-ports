[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "squidpy-ports"
version = "0.0.1"
description = "Reference implementations and fixture generators for squidpy ports"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Selman Ozleyen", email = "selman.ozleyen@helmholtz-munich.de" },
]
authors = [
  { name = "Selman Ozleyen" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Upstream STalign is vendored (vendor/STalign), never pip-installed: its setup.py
# reads requirements.txt verbatim and pins numpy==1.23.4 / torch==2.0.0 / Pillow==9.5.0,
# none of which have cp312+ wheels. Vendoring makes those pins irrelevant; uv.lock
# supplies the reproducibility instead, and the resolved versions are recorded in the
# provenance blob stamped onto every generated .npz.
dependencies = [
  # STalign.py imports all of these unconditionally at module level.
  "matplotlib",
  "numpy",
  "pandas",
  "plotly",
  "pynrrd",
  "requests",
  "scikit-image",
  "scipy",
  "tornado",
  "torch",
  # for debug logging (referenced from the issue template)
  "session-info2",
]
optional-dependencies.dev = [
  "pre-commit",
  "twine>=4.0.2",
]
optional-dependencies.doc = [
  "docutils>=0.8,!=0.18.*,!=0.19.*",
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "pandas",
  # Until pybtex >0.24.0 releases: https://bitbucket.org/pybtex-devs/pybtex/issues/169/
  "setuptools",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-tabs",
  "sphinxcontrib-bibtex>=1",
  "sphinxext-opengraph",
]
optional-dependencies.test = [
  "coverage>=7.10",
  "pytest",
  "pytest-cov",     # For VS Code’s coverage functionality
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://squidpy-ports.readthedocs.io/"
urls.Homepage = "https://github.com/theislab/squidpy-ports"
urls.Source = "https://github.com/theislab/squidpy-ports"

[tool.hatch.envs.default]
installer = "uv"
features = [ "dev" ]

[tool.hatch.envs.docs]
features = [ "doc" ]
scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
scripts.clean = "git clean -fdX -- {args:docs}"

# A single cell on purpose. This repo only ever runs a vendored torch model to emit
# fixtures; fanning that across Pythons costs CI minutes and buys nothing, and
# cross-platform BLAS/FFT reduction order would change the numbers we are pinning.
[[tool.hatch.envs.hatch-test.matrix]]
deps = [ "stable" ]
python = [ "3.13" ]

[tool.hatch.envs.hatch-test]
features = [ "dev", "test" ]

# Emit the reference bundle consumed by squidpy's tests/_data/stalign_reference/.
[tool.hatch.envs.generate]
installer = "uv"
scripts.run = "python -m squidpy_ports.stalign.generate {args}"

[tool.hatch.envs.generate.env-vars]
# Determinism: single-threaded BLAS/FFT so reduction order is fixed, and a
# non-interactive matplotlib backend because upstream LDDMM draws unconditionally.
MKL_NUM_THREADS = "1"
MPLBACKEND = "agg"
OMP_NUM_THREADS = "1"

[tool.hatch.envs.hatch-test.overrides]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
matrix.deps.env-vars = [
  { key = "UV_PRERELEASE", value = "allow", if = [ "pre" ] },
]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]
# Never lint or format the vendored GPL-3.0 upstream: it must stay byte-identical to
# the pinned commit, otherwise it is no longer the reference we claim to compare against.
extend-exclude = [ "vendor" ]

format.docstring-code-format = true

lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
xfail_strict = true
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]

[tool.coverage.run]
source = [ "squidpy_ports" ]
patch = [ "subprocess" ]
omit = [
  "**/test_*.py",
]

[tool.cruft]
skip = [
  "tests",
  "vendor",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
