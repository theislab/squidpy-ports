[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "squidpy-ports"
version = "0.0.1"
description = "Reference implementations and fixture generators for squidpy ports"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Selman Ozleyen", email = "selman.ozleyen@helmholtz-munich.de" },
]
authors = [
  { name = "Selman Ozleyen" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Every upstream is vendored under vendor/ and imported by path, never pip-installed (see each
# `upstream.py` for why). Each has its own extra, so each runs in an environment holding only
# what it imports; uv.lock supplies the reproducibility, and the resolved versions are recorded
# in the provenance stamped into every section of a reference bundle.
dependencies = [
  "anndata>=0.12",
  "numpy",
  # for debug logging (referenced from the issue template)
  "session-info2",
  "zarr>=3",
]
optional-dependencies.dev = [
  "pre-commit",
]
optional-dependencies.doc = [
  "docutils>=0.8,!=0.18.*,!=0.19.*",
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "pandas",
  "sphinx>=8.1",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-tabs",
  "sphinxext-opengraph",
]
# vendor/SpaGE imports these.
optional-dependencies.spage = [
  "pandas",
  "scikit-learn",
  "scipy",
]
# STalign.py imports all of these unconditionally at module level.
optional-dependencies.stalign = [
  "matplotlib",
  "pandas",
  "plotly",
  "pynrrd",
  "requests",
  "scikit-image",
  "scipy",
  "torch",
  "tornado",
]
optional-dependencies.test = [
  "coverage>=7.10",
  "pytest",
  "pytest-cov",     # For VS Code’s coverage functionality
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://squidpy-ports.readthedocs.io/"
urls.Homepage = "https://github.com/theislab/squidpy-ports"
urls.Source = "https://github.com/theislab/squidpy-ports"

[tool.hatch.envs.default]
installer = "uv"
features = [ "dev" ]

[tool.hatch.envs.docs]
features = [ "doc" ]
scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
scripts.clean = "git clean -fdX -- {args:docs}"

# One environment per upstream, all from the `ports` template (not meant to be run itself): `hatch run <method>:generate --out
# <method>_reference.zarr.zip` writes the bundle squidpy's reference tests download, `hatch run
# <method>:test` runs the guards. The variables are what the generators require: single-threaded BLAS so
# reduction order is fixed, a non-interactive matplotlib backend because STalign's LDDMM draws
# unconditionally.
[tool.hatch.envs.ports]
installer = "uv"
features = [ "test" ]
scripts.generate = "python -m squidpy_ports.{env_name}.generate {args}"
scripts.test = "pytest tests/test_common.py tests/test_{env_name}_generator.py {args}"
env-vars = { MKL_NUM_THREADS = "1", MPLBACKEND = "agg", OMP_NUM_THREADS = "1" }

[tool.hatch.envs.stalign]
template = "ports"
features = [ "stalign", "test" ]

[tool.hatch.envs.spage]
template = "ports"
features = [ "spage", "test" ]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]
# Never lint or format the vendored GPL-3.0 upstream: it must stay byte-identical to
# the pinned commit, otherwise it is no longer the reference we claim to compare against.
# Executed notebooks are recorded evidence. Formatters re-serialise the whole notebook JSON
# and re-emit every number from their own parse: ruff-format rewrote 1.1736298494271977e-06
# as ...75e-6 inside one, a one-ULP change to a committed measurement.
# The public-API notebooks under `squidpy-api/` are excluded for a second reason: they are
# prose as much as code, and the compact notebook idiom they are written in -- `a.set_title(t);
# a.set_xticks([])` on one line, single quotes throughout -- is a deliberate house style that
# ruff-format expands into something twice as long and harder to read beside its own markdown.
extend-exclude = [ "docs/notebooks", "vendor" ]

format.docstring-code-format = true

lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
xfail_strict = true
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]

[tool.coverage.run]
source = [ "squidpy_ports" ]
patch = [ "subprocess" ]
omit = [
  "**/test_*.py",
]

[tool.cruft]
skip = [
  "tests",
  "vendor",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/notebooks/example.ipynb",
]
